  // --- URL-Parameter auslesen ---
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get("lat")) || 49.0;
  const lng = parseFloat(params.get("lng")) || 9.5;
  const zoom = parseInt(params.get("zoom")) || 6;

  // Karte initialisieren mit Werten aus URL oder Standard
  var map = L.map('map').setView([lat, lng], zoom);

  // Tile-Layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap-Mitwirkende'
  }).addTo(map);

  // Sticker-Marker
  var dinoIcon = L.icon({
    iconUrl: 'velociraptors-logo03.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -60]
  });

  var meetup = L.icon({
    iconUrl: 'meeting-point.png',
    iconSize: [60, 80],
    iconAnchor: [30, 80],  // angepasst: Spitze unten
    popupAnchor: [0, -80]
  });

  L.marker([49.41325, 8.6919444], { icon: meetup })

    .bindTooltip("<b style='color:red;'>Meeting point Uferstraße</b>", { permanent: true, direction: "right", offset: [10, 0] });
